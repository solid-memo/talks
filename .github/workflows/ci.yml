name: CI

# Every change is checked before it is merged: a pull request, from this
# repository or a fork, runs the checks and builds every talk. A push to
# main does the same, then publishes the talks on GitHub Pages
# (README.md#publishing).

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# What every job may read. Only deploy may write to GitHub Pages, and
# says so: a job's permissions replace these.
permissions:
  contents: read

# A newer push to a pull request replaces its run still going. On main,
# runs queue instead, so that a deploy is never cut off halfway.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Every file states its copyright and license (`reuse lint`), and the
  # workflows are checked (actionlint, zizmor), with the linters from
  # PyPI, pinned in scripts/requirements-lint.txt.
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"
          cache: pip
          cache-dependency-path: scripts/requirements-lint.txt
      # pip installs outside the checkout, so only the repository's own
      # files are there to check.
      - run: pip install -r scripts/requirements-lint.txt
      - run: npm run lint:reuse
      - run: npm run lint:workflows

  # The slides' notes and pictures (npm run check:slides), then every
  # talk built as a web page, a PDF and a PowerPoint file (npm run build).
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # The PDF and the PowerPoint file are drawn in the runner's own
      # Google Chrome, so no browser is downloaded.
      - run: npm run check
        env:
          CHROME_PATH: /usr/bin/google-chrome
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  # The talks, published on GitHub Pages, from main only.
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [lint, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # To deploy the artifact to GitHub Pages, which proves the run is this
    # workflow's with an OIDC token.
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
